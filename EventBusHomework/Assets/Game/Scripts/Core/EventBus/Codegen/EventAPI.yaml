header: EventBusAPI
entityType: IEventBus
aggressiveInlining: true

namespace: SampleGame
className: EventAPI
directory: Assets/Game/Scripts/Core/EventBus/Codegen
 
imports:
- UnityEngine
- Atomic.Events
- System
- Atomic.Entities

events:
- StartPlayerTurn()
- EndPlayerTurn()
- StartEnemyTurn()
- EndEnemyTurn()
- Spawned(IGameEntity entity, GameBoardPosition position)
- Damaged(IGameEntity target, int damage)
- AttackStarted(AttackEventData eventData)
- AttackEnded(AttackEventData eventData)
- Moved(IGameEntity target, GameBoardPosition position)
- PushedOut(IGameEntity target, GameBoardPosition startPosition, Vector2Int pushDirection)
- PushedInTarget(PushInTargetEventData pushData)
- Pushed(IGameEntity target, GameBoardPosition startPosition, Vector2Int pushDirection)
- Died(IGameEntity target)