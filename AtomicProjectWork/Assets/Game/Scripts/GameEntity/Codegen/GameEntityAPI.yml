header: EntityAPI
entityType: IGameEntity
aggressiveInlining: true

namespace: SampleGame
className: GameEntityAPI
directory: Assets/Game/Scripts/GameEntity/Codegen
 
imports:
- UnityEngine
- Atomic.Elements
- UnityEngine.AI

tags:
- Damageable
- Moveable
- Interactible
- Lootable

values:

# Main
- GameObject: GameObject
- Transform: Transform
- Rigidbody: Rigidbody
- NavAgent: NavMeshAgent
- Animator: Animator
  
#Movement  
- MoveSpeed: IReactiveVariable<float>
- NormalizedCurrentSpeed: IValue<float>
- MoveCondition: IExpression<bool>
- IsMoving: IValue<bool>
- MoveDirection: IReactiveVariable<Vector3>
- MovePointAction: IAction<Vector3>
- TeleportAction: IAction<Vector3>
- StopAction: IAction
- ForwardDirection: IReactiveVariable<float>

#Rotation
- AngularSpeed: IValue<float>
- AngularDirection: IValue<Vector3>
- TurnDirection: IReactiveVariable<float>
  
#Life
- MaxHealth: IReactiveVariable<int>
- Health: IReactiveVariable<int>
- Lifetime: Cooldown
- DestroyAction: IAction
- DamagedEvent: IEvent
- DeathEvent: IEvent

#Mana
- MaxMana: IValue<int>
- CurrentMana: IReactiveVariable<int>
    
#Abbility
- Abilities: IReactiveDictionary<string, Ability>
- SelectedAbility: IReactiveVariable<Ability>
- SelectAbilityCondition: IValue<bool>
- SelectAbilityAction: IAction<Ability>
    
#Combat
- Damage: IReactiveVariable<int>
- ExtraDamage: IExpression<int>
- Target: IReactiveVariable<IGameEntity>
- DamageRadius: IValue<float>
- FireAction: IAction
- FirePoint: Transform
  
#Interact
- InteractAction: IAction<IGameEntity> #IEntity — Character
- TargetInteractible: IReactiveVariable<IGameEntity> #Entity — current interactible item

#Other
- Owner: IReactiveVariable<IGameEntity>
- Effects: IReactiveDictionary<string, Effect>
- ProjectileEffects : EffectConfig[]

#Loot
- Loot: SceneEntity[]

#Physics
- Trigger: TriggerEventReceiver